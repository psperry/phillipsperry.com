t-size:25px;line-height:1.25;color:#889780;display:block;margin-bottom:16px}.photo-space p{font-family:var(--serif);font-size:25px;line-height:1.35;margin:0 auto 14px;max-width:250px}.photo-space small{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;display:block;color:var(--muted)}.photo-caption{font-size:11px;color:var(--muted);margin:12px 0 0;text-align:right}.intro-line{border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:32px;padding:20px 0;color:var(--muted);font-size:13px}.section{padding:64px 0}.section-heading{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:30px}.section-heading h2{font:400 36px/1.2 var(--serif);letter-spacing:-1px;margin:0}.section-heading a{font-size:13px}.project-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}.project-card{display:block}.project-card:hover h3{color:var(--accent)}.project-card .visual{height:205px;display:flex;align-items:center;justify-content:center;margin-bottom:23px;overflow:hidden}.visual.site{background:#dce2d1}.visual.lamp{background:#e8dcc8}.visual.ledger{background:#dce3e0}.visual svg{width:100%;height:100%}.card-meta{display:flex;justify-content:space-between;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);gap:12px}.project-card h3{font:400 26px/1.2 var(--serif);letter-spacing:-.6px;margin:12px 0}.project-card p{font-size:14px;line-height:1.75;color:var(--muted);margin:0}.notebook-section{border-top:1px solid var(--line)}.note-row{display:grid;grid-template-columns:100px 1fr 190px 24px;gap:24px;padding:28px 0;border-top:1px solid var(--line);align-items:center}.note-row .note-number{font:italic 22px var(--serif);color:#8a9588}.note-row h3{font:400 27px/1.25 var(--serif);letter-spacing:-.5px;margin:0 0 7px}.note-row p{font-size:14px;color:var(--muted);margin:0}.note-category{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.3px <template id="home"><div class="wrap"><section class="hero"><div><p class="eyebrow">A personal collection of work &amp; wondering</p><h1>Following<br>the <em>curiosity.</em></h1><p class="lede">I’m Phillip. I work with accounting, explore technology, and use AI to help figure things out. This is where I’m keeping track of the projects, experiments, and lessons along the way.</p><a class="text-link" href="#/projects">Explore the projects <span aria-hidden="true">↗</span></a></div><div><div class="photo-space" role="img" aria-label="Placeholder reserved for Phillip’s original sunset photograph of Fergus in the yard"><div><span class="number" aria-hidden="true">A place for the everyday.</span><p>Fergus, the yard,<br>and the evening light.</p><small>Your original photograph belongs here</small></div></div><p class="photo-caption">Photo space reserved · sunset with Fergus</p></div></section><div class="intro-line"><span>A working notebook, with the rough edges left in.</span><span>Accounting / AI / Technology / Everyday life</span></div><section class="section"><div class="section-heading"><h2>Work in progress</h2><a href="#/projects">All projects <span aria-hidden="true">↗</span></a></div><div class="project-grid" data-project-cards=""></div></section><section class="section notebook-section"><div class="section-heading"><h2>From the notebook</h2><a href="#/notebook">All notes <span aria-hidden="true">↗</span></a></div><div data-notes=""></div></section></div><section class="about-band"><div class="wrap about-inner"><div><p class="eyebrow">The person behind the projects</p><h2>Practical questions.<br>Interesting detours.</h2></div><div><p>I’m interested in what happens when an everyday problem becomes a reason to learn something new. Sometimes that means a better accounting workflow. Sometimes it means a smart lamp. This site is a place to keep the process, not just the result.</p><a class="text-link" href="#/about">A little more about me <span aria-hidden="true">↗</span></a></div></div></section></template>
<template id="projects"><div class="wrap"><div class="page-heading"><p class="eyebrow">Projects</p><h1>Things I’m<br>working through.</h1><p>The bigger questions, ongoing builds, and experiments that keep changing as I learn. These pages are starting points for documenting the work.</p></div><section class="section" style="padding-top:10px"><div class="project-grid" data-project-cards=""></div></section></div></template>
<template id="notebook"><div class="wrap"><div class="page-heading"><p class="eyebrow">Notebook</p><h1>Small experiments.<br>Useful lessons.</h1><p>Observations from working with AI, exploring technology, and trying a different way of solving a problem.</p></div><section class="section" style="padding-top:0"><div data-notes=""></div></section></div></template>
<template id="about"><div class="wrap"><div class="page-heading"><p class="eyebrow">About</p><h1>Hi, I’m Phillip.</h1><p>Accounting, AI, technology—and the questions that connect them.</p></div><div class="about-page"><div><p>I’m interested in practical problem-solving: improving a workflow, understanding how something works, or seeing whether a new tool can help with an old problem.</p><p>AI has become part of that process. I’m exploring what it can actually be useful for, where it gets things wrong, and how to keep a human hand on the decisions that matter.</p><p>This is my personal website. Projects are the larger efforts I’m working through; the Notebook is for smaller experiments and observations. Both leave room for false starts, revisions, and lessons learned.</p><p>There’s room here for life outside the screen, too—including photography, the outdoors, and Fergus.</p><a class="text-link" href="#/project/website">How this website began <span aria-hidden="true">↗</span></a></div><div><div class="photo-space" role="img" aria-label="Placeholder for Phillip’s original trail photograph featuring Fergus"><div><span class="number" aria-hidden="true">Away from the screen.</span><p>A trail, some fresh air,<br>and Fergus.</p><small>Original photography to come</small></div></div></div></div></div></template>
<noscript><div class="wrap empty"><h1>Phillip Sperry</h1><p>A personal notebook about accounting, AI, technology, and practical problem-solving.</p><p>This initial design preview uses JavaScript to display its pages. Please enable JavaScript to explore Projects, Notebook, and About.</p></div></noscript>
<script>
const diagrams={site:`<svg viewBox="0 0 360 220" role="img" aria-label="Editorial illustration of a website layout"><rect x="58" y="36" width="244" height="152" rx="3" fill="#f5f2e9" stroke="#87947b"/><path d="M58 60H302" stroke="#87947b"/><circle cx="70" cy="49" r="2" fill="#87947b"/><circle cx="79" cy="49" r="2" fill="#87947b"/><path d="M80 85h92M80 99h70M80 116h80M80 128h62" stroke="#87947b" stroke-width="3"/><rect x="198" y="79" width="81" height="66" fill="#b4bf9f"/><path d="M80 161h54m18 0h55m18 0h54" stroke="#b4bf9f" stroke-width="14"/></svg>`,lamp:`<svg viewBox="0 0 360 220" role="img" aria-label="Conceptual illustration of a lamp and removable electronics tray"><path d="M143 41h74l29 66H114z" fill="#b99e74"/><path d="M180 109v45m-42 15h84" stroke="#806c4f" stroke-width="5"/><rect x="126" y="163" width="108" height="13" rx="4" fill="#806c4f"/><path d="M277 68q25 18 0 37m12-47q39 26 0 55" fill="none" stroke="#b99e74" stroke-width="2"/><path d="M125 190h109" stroke="#b99e74" stroke-dasharray="4 4"/><text x="180" y="207" text-anchor="middle" fill="#806c4f" font-family="monospace" font-size="8" letter-spacing="2">CONCEPT / IN DEVELOPMENT</text></svg>`,ledger:`<svg viewBox="0 0 360 220" role="img" aria-label="Conceptual illustration of an accounting ledger"><rect x="88" y="35" width="184" height="149" fill="#f5f2e9" stroke="#82988f"/><path d="M88 66h184m-184 28h184m-184 28h184m-184 28h184M150 66v118m68-118v118" stroke="#bac9c2"/><path d="M105 51h71m-71 29h28m34 0h28m36 0h24m-150 28h28m34 0h28m36 0h24m-150 28h28m34 0h28m36 0h24" stroke="#82988f" stroke-width="3"/><path d="m233 167 5 5 10-13" stroke="#8d422d" stroke-width="2" fill="none"/></svg>`};
const projects=[{id:'website',number:'001',title:'Building PhillipSperry.com',kind:'site',status:'In progress',description:'From a blank domain to a personal website: a project about making this very place.',subtitle:'The website is the first project.',body:`<p>This started with a new domain and a question:</p><blockquote>“I just got a new domain name, PhillipSperry.com. Wondering how far you go. Can you design it and push it out for me?”</blockquote><p>The idea is to make a personal place for projects, experiments, and things I’m learning—and to document the collaboration that gets it built.</p><h2>A place for the process</h2><p>The aim is a site that feels personal and editorial, with my own photographs and room for the work as it happens. The false starts belong in the story, too.</p><h2>The foundation</h2><p>The domain stays with Hover. The source belongs in GitHub, with Netlify as the intended host. Changes should be version-controlled and reviewed in a preview before they reach the live site.</p><h2>Where it stands</h2><p>The repository has been created, and this initial version establishes the page structure and visual direction. Photography, approved copy, and the first deployment are the next pieces to put in place.</p><h2>What I want to learn</h2><p>How far can an AI collaborator take a website from an idea to something usable? And where does my judgment make the difference?</p>`},{id:'smart-lamp',number:'002',title:'A lamp that became a system',kind:'lamp',status:'In progress',description:'A battery-powered table lamp grew into an experiment in presence sensing and modular smart power.',subtitle:'An everyday lighting problem, with a few interesting detours.',body:`<p>The starting question was straightforward: how do I power a lamp on a freestanding table without running a cord to it?</p><h2>The idea keeps growing</h2><p>A battery-powered lamp evolved into a modular smart-power platform. The design now explores ESP hardware, mmWave presence sensing, Home Assistant, battery monitoring, and a removable electronics chassis or tray.</p><p>Potentially, some of the components will be 3D printed. Each new requirement creates another question about how the pieces should fit together.</p><h2>Working with AI</h2><p>This is an ongoing example of AI-assisted design: working through possibilities, revising an approach, and making the next decision concrete enough to evaluate.</p><h2>Still to document</h2><p>This project page will grow with the design decisions, prototypes, measurements, and things that do not work as expected. The illustration is a concept, not a drawing of a completed build.</p>`},{id:'accounting',number:'003',title:'Rethinking accounting workflows',kind:'ledger',status:'Exploration',description:'Bank rules, better bookkeeping workflows, and questions about an independent ledger.',subtitle:'Looking for better ways to make the routine work.',body:`<p>Accounting is full of repeated decisions. That makes it an interesting place to explore tools that can help make workflows more consistent and easier to understand.</p><h2>Two related questions</h2><p>One area of exploration is intelligent QuickBooks bank-rule design. Another is the architecture of an independent accounting ledger.</p><p>They share a practical question: what should be automated, what should remain visible, and where should a person make the decision?</p><h2>Keeping the work public, carefully</h2><p>This page will focus on methods, design choices, and lessons that can be shared without exposing professional or client-sensitive information. Any future examples will need to be suitable for public use.</p><h2>A starting point</h2><p>This is a project outline. Specific implementations, findings, and comparisons will be added as the work is documented.</p>`}];
const notes=[{id:'enhance-alter',number:'01',title:'When “Enhance” Becomes “Alter”',category:'AI / Fidelity',description:'What restoring an old family photograph taught me about working with AI.',subtitle:'Sometimes fidelity matters more than improvement.',body:`<p>I asked ChatGPT to restore an old, faded photograph of my parents and make a black-and-white version.</p><p>The photograph looked improved. But something else had changed: my mother’s eyes now appeared to be looking directly at the camera. That was not where she was looking in the original.</p><h2>A better image—or a different one?</h2><p>Restoring the photograph was the task. Changing the subject was not. The altered gaze was a small visual difference with a much larger consequence: it changed what the photograph recorded.</p><h2>Putting control back into the process</h2><p>I asked ChatGPT to reverse the change and identify and reverse any other unintended alterations to the subjects. We then established a rule that changes of this kind should require permission.</p><h2>The lesson I’m keeping</h2><p>When I ask for an enhancement, I need to be clear about what must remain faithful to the source. “Improve this” can leave too much room for interpretation.</p><blockquote>Sometimes what I want most is not improvement, but fidelity.</blockquote><p>The family photographs are not included in this draft. Publishing them is a separate decision.</p>`},{id:'downton',number:'02',title:'The clue was in the subtitles',category:'AI / Experiment',description:'Identifying out-of-order Downton Abbey episodes took a more reliable turn.',subtitle:'A useful reminder to try a different kind of evidence.',body:`<p>I was trying to identify incorrectly ordered Blu-ray rips of Downton Abbey. The experiment began with screenshots: could AI recognize which episode I was looking at?</p><h2>A different source of evidence</h2><p>The more reliable approach turned out to be extracting and reading subtitles from the already-ripped video files. Dialogue provided a better route to identification than the screenshots.</p><h2>What changed</h2><p>The task stayed the same. The evidence changed. Instead of asking the model to identify an episode from an image, we gave it text from the episode itself.</p><h2>A lesson beyond this experiment</h2><p>When an AI-assisted approach is uncertain, it can be useful to rethink the input before refining the prompt again. Sometimes another representation of the same material makes the problem much easier to work through.</p><p>This note describes the method; it does not reproduce episode footage or subtitle transcripts.</p>`}];
const main=document.getElementById('main');
function projectCards(){return projects.map(p=>`<a class="project-card" href="#/project/${p.id}"><div class="visual ${p.kind}">${diagrams[p.kind]}</div><div class="card-meta"><span>Project ${p.number}</span><span>${p.status}</span></div><h3>${p.title}</h3><p>${p.description}</p></a>`).join('')}
function noteRows(){return notes.map(n=>`<a class="note-row" href="#/note/${n.id}"><span class="note-number">${n.number}</span><div><h3>${n.title}</h3><p>${n.description}</p></div><span class="note-category">${n.category}</span><span aria-hidden="true">↗</span></a>`).join('')}
function render(){const route=location.hash.slice(1)||'/';const parts=route.split('/').filter(Boolean);let nav=parts[0]||'';let title='Projects, experiments & everyday curiosity';if(!parts.length||['projects','notebook','about'].includes(parts[0])&&parts.length===1){const id=parts[0]||'home';main.replaceChildren(document.getElementById(id).content.cloneNode(true));title=id==='home'?title:id[0].toUpperCase()+id.slice(1);main.querySelectorAll('[data-project-cards]').forEach(el=>el.innerHTML=projectCards());main.querySelectorAll('[data-notes]').forEach(el=>el.innerHTML=noteRows())}else{const isProject=parts[0]==='project';const item=parts.length===2?(isProject?projects:parts[0]==='note'?notes:[]).find(p=>p.id===parts[1]):null;if(item){nav=isProject?'projects':'notebook';title=item.title;main.innerHTML=`<div class="wrap"><article class="article"><a class="back" href="#/${nav}">← Back to ${nav}</a><p class="eyebrow">${isProject?'Project '+item.number:item.category} · Draft</p><h1>${item.title}</h1><p class="subtitle">${item.subtitle}</p>${isProject?`<div class="status">${item.status} · This is a working project journal.</div>`:''}${item.body}<div class="related"><a href="#/${nav}">Explore more ${nav} ↗</a><a href="#/about">About Phillip ↗</a></div></article></div>`}else{title='Page not found';main.innerHTML='<div class="wrap empty"><p class="eyebrow">Page not found</p><h1>That page isn’t here.</h1><a class="text-link" href="#/">Back to the homepage ↗</a></div>'}}document.querySelectorAll('[data-nav]').forEach(a=>{if(a.dataset.nav===nav)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.title='Phillip Sperry — '+title;window.scrollTo(0,0);if(window.__rendered)main.focus({preventScroll:true});window.__rendered=true}
addEventListener('hashchange',()=>{if(location.hash!=='#main')render()});render();
</script>
