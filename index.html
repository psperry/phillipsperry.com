const diagrams={site:`<svg viewBox="0 0 360 220" role="img" aria-label="Editorial illustration of a website layout"><rect x="58" y="36" width="244" height="152" rx="3" fill="#f5f2e9" stroke="#87947b"/><path d="M58 60H302" stroke="#87947b"/><circle cx="70" cy="49" r="2" fill="#87947b"/><circle cx="79" cy="49" r="2" fill="#87947b"/><path d="M80 85h92M80 99h70M80 116h80M80 128h62" stroke="#87947b" stroke-width="3"/><rect x="198" y="79" width="81" height="66" fill="#b4bf9f"/><path d="M80 161h54m18 0h55m18 0h54" stroke="#b4bf9f" stroke-width="14"/></svg>`,lamp:`<svg viewBox="0 0 360 220" role="img" aria-label="Conceptual illustration of a lamp and removable electronics tray"><path d="M143 41h74l29 66H114z" fill="#b99e74"/><path d="M180 109v45m-42 15h84" stroke="#806c4f" stroke-width="5"/><rect x="126" y="163" width="108" height="13" rx="4" fill="#806c4f"/><path d="M277 68q25 18 0 37m12-47q39 26 0 55" fill="none" stroke="#b99e74" stroke-width="2"/><path d="M125 190h109" stroke="#b99e74" stroke-dasharray="4 4"/><text x="180" y="207" text-anchor="middle" fill="#806c4f" font-family="monospace" font-size="8" letter-spacing="2">CONCEPT / IN DEVELOPMENT</text></svg>`,ledger:`<svg viewBox="0 0 360 220" role="img" aria-label="Conceptual illustration of an accounting ledger"><rect x="88" y="35" width="184" height="149" fill="#f5f2e9" stroke="#82988f"/><path d="M88 66h184m-184 28h184m-184 28h184m-184 28h184M150 66v118m68-118v118" stroke="#bac9c2"/><path d="M105 51h71m-71 29h28m34 0h28m36 0h24m-150 28h28m34 0h28m36 0h24m-150 28h28m34 0h28m36 0h24" stroke="#82988f" stroke-width="3"/><path d="m233 167 5 5 10-13" stroke="#8d422d" stroke-width="2" fill="none"/></svg>`};
const projects=[{id:'website',number:'001',title:'Building PhillipSperry.com',kind:'site',status:'In progress',description:'From a blank domain to a personal website: a project about making this very place.',subtitle:'The website is the first project.',body:`<p>This started with a new domain and a question:</p><blockquote>“I just got a new domain name, PhillipSperry.com. Wondering how far you go. Can you design it and push it out for me?”</blockquote><p>The idea is to make a personal place for projects, experiments, and things I’m learning—and to document the collaboration that gets it built.</p><h2>A place for the process</h2><p>The aim is a site that feels personal and editorial, with my own photographs and room for the work as it happens. The false starts belong in the story, too.</p><h2>The foundation</h2><p>The domain stays with Hover. The source belongs in GitHub, with Netlify as the intended host. Changes should be version-controlled and reviewed in a preview before they reach the live site.</p><h2>Where it stands</h2><p>The repository has been created, and this initial version establishes the page structure and visual direction. Photography, approved copy, and the first deployment are the next pieces to put in place.</p><h2>What I want to learn</h2><p>How far can an AI collaborator take a website from an idea to something usable? And where does my judgment make the difference?</p>`},{id:'smart-lamp',number:'002',title:'A lamp that became a system',kind:'lamp',status:'In progress',description:'A battery-powered table lamp grew into an experiment in presence sensing and modular smart power.',subtitle:'An everyday lighting problem, with a few interesting detours.',body:`<figure class="lamp-concept"><a href="lamp-concept.png" target="_blank" rel="noopener"><img src="lamp-concept.png" alt="Lamp project concept sheet showing the enclosure under an end table, rear connections, internal components, intake vents, and a proposed rear panel." loading="lazy"></a><figcaption>Concept mockup from the design process. Components, labels, and dimensions shown are illustrative; the engineering is still in progress.</figcaption></figure><p>The starting question was straightforward: how do I power a lamp on a freestanding table without running a cord to it?</p><h2>The idea keeps growing</h2><p>A battery-powered lamp evolved into a modular smart-power platform. The design now explores ESP hardware, mmWave presence sensing, Home Assistant, battery monitoring, and a removable electronics chassis or tray.</p><p>Potentially, some of the components will be 3D printed. Each new requirement creates another question about how the pieces should fit together.</p><h2>Working with AI</h2><p>This is an ongoing example of AI-assisted design: working through possibilities, revising an approach, and making the next decision concrete enough to evaluate.</p><h2>Still to document</h2><p>This project page will grow with the design decisions, prototypes, measurements, and things that do not work as expected. The mockup is a concept from the design process, not a completed build.</p>`},{id:'accounting',number:'003',title:'Smarter QBO bank rules',kind:'ledger',status:'Exploration',description:'Exploring more thoughtful QuickBooks bank rules and better bookkeeping workflows.',subtitle:'Looking for better ways to make the routine work.',body:`<p>Accounting is full of repeated decisions. That makes it an interesting place to explore tools that can help make workflows more consistent and easier to understand.</p><h2>Two related questions</h2><p>One area of exploration is intelligent QuickBooks bank-rule design. Another is the architecture of an independent accounting ledger.</p><p>They share a practical question: what should be automated, what should remain visible, and where should a person make the decision?</p><h2>Keeping the work public, carefully</h2><p>This page will focus on methods, design choices, and lessons that can be shared without exposing professional or client-sensitive information. Any future examples will need to be suitable for public use.</p><h2>A starting point</h2><p>This is a project outline. Specific implementations, findings, and comparisons will be added as the work is documented.</p>`}];
projects.push({id:'independent-ledger',number:'004',title:'An independent accounting ledger',kind:'ledger',status:'Concept',description:'Exploring what a modern ledger could look like, with more control and portability.',subtitle:'A question about the foundations of accounting software.',body:`<p>An independent ledger is an architecture I’m exploring: a way to think through the accounting records themselves, and how the surrounding tools should work with them.</p><h2>Questions to work through</h2><p>What should the ledger own? How should records move between systems? Where can AI help, and where must the accounting remain explicit and verifiable?</p><h2>Where it stands</h2><p>This is a concept in development. This journal will document the design choices, experiments, and lessons as the work progresses. Any examples will need to be suitable for public use, without professional or client-sensitive information.</p>`});
const notes=[{id:'enhance-alter',number:'01',title:'When “Enhance” Becomes “Alter”',category:'AI / Fidelity',description:'What restoring an old family photograph taught me about working with AI.',subtitle:'Sometimes fidelity matters more than improvement.',body:`<p>I asked ChatGPT to restore an old, faded photograph of my parents and make a black-and-white version.</p><p>The photograph looked improved. But something else had changed: my mother’s eyes now appeared to be looking directly at the camera. That was not where she was looking in the original.</p><h2>A better image—or a different one?</h2><p>Restoring the photograph was the task. Changing the subject was not. The altered gaze was a small visual difference with a much larger consequence: it changed what the photograph recorded.</p><h2>Putting control back into the process</h2><p>I asked ChatGPT to reverse the change and identify and reverse any other unintended alterations to the subjects. We then established a rule that changes of this kind should require permission.</p><h2>The lesson I’m keeping</h2><p>When I ask for an enhancement, I need to be clear about what must remain faithful to the source. “Improve this” can leave too much room for interpretation.</p><blockquote>Sometimes what I want most is not improvement, but fidelity.</blockquote><p>The family photographs are omitted from this public draft pending approval.</p>`},{id:'downton',number:'02',title:'The clue was in the subtitles',category:'AI / Experiment',description:'Identifying out-of-order Downton Abbey episodes took a more reliable turn.',subtitle:'A useful reminder to try a different kind of evidence.',body:`<p>I was trying to identify incorrectly ordered Blu-ray rips of Downton Abbey. The experiment began with screenshots: could AI recognize which episode I was looking at?</p><h2>A different source of evidence</h2><p>The more reliable approach turned out to be extracting and reading subtitles from the already-ripped video files. Dialogue provided a better route to identification than the screenshots.</p><h2>What changed</h2><p>The task stayed the same. The evidence changed. Instead of asking the model to identify an episode from an image, we gave it text from the episode itself.</p><h2>A lesson beyond this experiment</h2><p>When an AI-assisted approach is uncertain, it can be useful to rethink the input before refining the prompt again. Sometimes another representation of the same material makes the problem much easier to work through.</p><p>This note describes the method; it does not reproduce episode footage or subtitle transcripts.</p>`}];
notes.push({id:'modular-tray',number:'03',title:'Making room for the next revision',category:'Design / In progress',description:'Exploring a removable electronics tray for the smart lamp.',subtitle:'A working design question from the smart lamp project.',body:`<p>The smart lamp project includes an idea for a removable electronics chassis or tray. Rather than treating the enclosure as a final step, it becomes part of the design process.</p><h2>A design still taking shape</h2><p>The project explores ESP hardware, presence sensing, battery monitoring, and possible 3D-printed parts. A removable tray raises useful questions about how these pieces fit together and how the design can accommodate the next revision.</p><p>This is a starting note for documenting the mechanical and electrical decisions as they develop.</p>`});
const main=document.getElementById('main');
function projectCards(){return projects.map(p=>`<a class="project-card" href="#/project/${p.id}"><div class="visual ${p.kind}">${p.kind==='site'?'<img class="card-photo" src="fergus-trail.jpeg" width="768" height="1024" loading="lazy" alt="Fergus exploring a leaf-covered woodland trail.">':p.kind==='lamp'?'<img class="card-photo lamp-mockup" src="lamp-concept.png" loading="lazy" alt="Concept mockup of a table lamp and wooden battery-power enclosure, with rear panel and internal views.">':diagrams[p.kind]}<span class="status-pill">${p.status}</span></div><div class="card-meta"><span>Project ${p.number}</span></div><h3>${p.title}</h3><p>${p.description}</p><div class="card-tags">${({site:["Web","AI","Design"],lamp:["Home Assistant","Electronics","Design"],ledger:["Accounting","AI","Workflows"]}[p.kind]).map(tag=>`<span>${tag}</span>`).join('')}</div></a>`).join('')}
function noteRows(){return notes.map(n=>`<a class="note-row" href="#/note/${n.id}"><span class="note-number">${n.number}</span><div><h3>${n.title}</h3><p>${n.description}</p></div><span class="note-category">${n.category}</span><span aria-hidden="true">↗</span></a>`).join('')}
function render(){const route=location.hash.slice(1)||'/';const parts=route.split('/').filter(Boolean);document.body.classList.toggle('home-view',!parts.length);let nav=parts[0]||'';let title='Projects, experiments & everyday curiosity';if(!parts.length||['projects','notebook','about'].includes(parts[0])&&parts.length===1){const id=parts[0]||'home';main.replaceChildren(document.getElementById(id).content.cloneNode(true));title=id==='home'?title:id[0].toUpperCase()+id.slice(1);main.querySelectorAll('[data-project-cards]').forEach(el=>el.innerHTML=projectCards());main.querySelectorAll('[data-notes]').forEach(el=>el.innerHTML=noteRows())}else{const isProject=parts[0]==='project';const item=parts.length===2?(isProject?projects:parts[0]==='note'?notes:[]).find(p=>p.id===parts[1]):null;if(item){nav=isProject?'projects':'notebook';title=item.title;main.innerHTML=`<div class="wrap"><article class="article"><a class="back" href="#/${nav}">← Back to ${nav}</a><p class="eyebrow">${isProject?'Project '+item.number:item.category} · Draft</p><h1>${item.title}</h1><p class="subtitle">${item.subtitle}</p>${isProject?`<div class="status">${item.status} · This is a working project journal.</div>`:''}${item.body}<div class="related"><a href="#/${nav}">Explore more ${nav} ↗</a><a href="#/about">About Phillip ↗</a></div></article></div>`}else{title='Page not found';main.innerHTML='<div class="wrap empty"><p class="eyebrow">Page not found</p><h1>That page isn’t here.</h1><a class="text-link" href="#/">Back to the homepage ↗</a></div>'}}document.querySelectorAll('[data-nav]').forEach(a=>{if(a.dataset.nav===nav)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.title='Phillip Sperry — '+title;window.scrollTo(0,0);if(window.__rendered)main.focus({preventScroll:true});window.__rendered=true}
addEventListener('hashchange',()=>{if(location.hash!=='#main')render()});render();
</script>
