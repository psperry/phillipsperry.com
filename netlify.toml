
[[redirects]]
  from = "/drafts/whos-teaching-the-apprentices/"
  to = "https://phillipsperry.com/articles/whos-teaching-the-apprentices/"
  status = 301
  force = true
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/articles/:slug/"
  to = "/share-:slug.html"
  status = 200

[[redirects]]
  from = "/drafts/"
  to = "/drafts.html"
  status = 200

[[redirects]]
  from = "/drafts/:slug/"
  to = "/draft-:slug.html"
  status = 200

[[headers]]
  for = "/drafts/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/drafts.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/draft-*.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
