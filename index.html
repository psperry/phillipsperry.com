<template id="about"><div class="wrap"><div class="page-heading"><p class="eyebrow">About</p><h1>Hi, I’m Phillip.</h1><p>Accounting, AI, technology—and the questions that connect them.</p></div><div class="about-page"><div><p>I’m interested in practical problem-solving: improving a workflow, understanding how something works, or seeing whether a new tool can help with an old problem.</p><p>AI has become part of that process. I’m exploring what it can actually be useful for, where it gets things wrong, and how to keep a human hand on the decisions that matter.</p><p>This is my personal website. Projects are the larger efforts I’m working through; the Notebook is for experiments, observations, and larger questions. Both leave room for false starts, revisions, and lessons learned.</p><p>Pulling the Thread is how I think about the connections between the work and the questions it raises—about creativity, relationships, meaning, beauty, faith, and God. They are threads in the same life.</p><p>I’m also working on a biography/life-story project. This website is its field notebook: what I was doing, what I was thinking, and how one thing led to another.</p><p>There’s room here for life outside the screen, too—including photography, the outdoors, and Fergus.</p><a class="text-link" href="#/project/website">How this website began <span aria-hidden="true">↗</span></a></div><div><figure class="about-photo"><img src="fergus-trail.jpeg" width="768" height="1024" loading="lazy" alt="Fergus walking along a wooded trail carpeted with autumn leaves."><figcaption>A little curiosity, away from the screen. · Photograph by Phillip Sperry</figcaption></figure></div></div></div></template>

const diagrams={site:`<svg viewBox="0 0 360 220" role="img" aria-label="Editorial illustration of a website layout"><rect x="58" y="36" width="244" height="152" rx="3" fill="#f5f2e9" stroke="#87947b"/><path d="M58 60H302" stroke="#87947b"/><circle cx="70" cy="49" r="2" fill="#87947b"/><circle cx="79" cy="49" r="2" fill="#87947b"/><path d="M80 85h92M80 99h70M80 116h80M80 128h62" stroke="#87947b" stroke-width="3"/><rect x="198" y="79" width="81" height="66" fill="#b4bf9f"/><path d="M80 161h54m18 0h55m18 0h54" stroke="#b4bf9f" stroke-width="14"/></svg>`,lamp:`<svg viewBox="0 0 360 220" role="img" aria-label="Conceptual illustration of a lamp and removable electronics tray"><path d="M143 41h74l29 66H114z" fill="#b99e74"/><path d="M180 109v45m-42 15h84" stroke="#806c4f" stroke-width="5"/><rect x="126" y="163" width="108" height="13" rx="4" fill="#806c4f"/><path d="M277 68q25 18 0 37m12-47q39 26 0 55" fill="none" stroke="#b99e74" stroke-width="2"/><path d="M125 190h109" stroke="#b99e74" stroke-dasharray="4 4"/><text x="180" y="207" text-anchor="middle" fill="#806c4f" font-family="monospace" font-size="8" letter-spacing="2">CONCEPT / IN DEVELOPMENT</text></svg>`,ledger:`<svg viewBox="0 0 360 220" role="img" aria-label="Conceptual illustration of an accounting ledger"><rect x="88" y="35" width="184" height="149" fill="#f5f2e9" stroke="#82988f"/><path d="M88 66h184m-184 28h184m-184 28h184m-184 28h184M150 66v118m68-118v118" stroke="#bac9c2"/><path d="M105 51h71m-71 29h28m34 0h28m36 0h24m-150 28h28m34 0h28m36 0h24m-150 28h28m34 0h28m36 0h24" stroke="#82988f" stroke-width="3"/><path d="m233 167 5 5 10-13" stroke="#8d422d" stroke-width="2" fill="none"/></svg>`};
const projects=[{id:'website',number:'001',title:'Building PhillipSperry.com',kind:'site',status:'In progress',description:'From a blank domain to a personal website: a project about making this very place.',subtitle:'The website is the first project.',body:`<p>This started with a new domain and a question:</p><blockquote>“I just got a new domain name, PhillipSperry.com. Wondering how far you go. Can you design it and push it out for me?”</blockquote><p>The idea is to make a personal place for projects, experiments, and things I’m learning—and to document the collaboration that gets it built.</p><h2>A place for the process</h2><p>The aim is a site that feels personal and editorial, with my own photographs and room for the work as it happens. The false starts belong in the story, too.</p><h2>The foundation</h2><p>The domain stays with Hover. The source belongs in GitHub, with Netlify as the intended host. Changes should be version-controlled and reviewed in a preview before they reach the live site.</p><h2>Where it stands</h2><p>The repository has been created, and this initial version establishes the page structure and visual direction. Photography, approved copy, and the first deployment are the next pieces to put in place.</p><h2>What I want to learn</h2><p>How far can an AI collaborator take a website from an idea to something usable? And where does my judgment make the difference?</p>`},{id:'smart-lamp',number:'002',title:'I Just Wanted a Lamp. Now I’m Designing a Battery-Powered Furniture Platform.',cardTitle:'A lamp that became a system',kind:'lamp',status:'In progress',description:'A battery-powered table lamp grew into an experiment in presence sensing and modular smart power.',subtitle:'An everyday lighting problem, with a few interesting detours.',body:`<figure class="lamp-concept"><a href="lamp-concept.png" target="_blank" rel="noopener"><img src="lamp-concept.png" alt="Lamp project concept sheet showing the enclosure under an end table, rear connections, internal components, intake vents, and a proposed rear panel." loading="lazy"></a><figcaption>Concept mockup from the design process. Components, labels, and dimensions shown are illustrative; the engineering is still in progress.</figcaption></figure><p>This started with a lamp.</p><p>We have a freestanding table in our living room where I wanted to put one. There is no floor outlet nearby, and running a cord across the floor wasn&#x27;t an option.</p><p>So the original question was pretty simple:</p><p><strong>Can I run a normal-looking table lamp from a battery and hide everything inside a box on the shelf below it?</strong></p><p>That seemed easy enough.</p><p>Put a battery in a box. Plug in the lamp. Done.</p><p>Then I started pulling the thread.</p><h2>First, get rid of the inverter</h2><p>One obvious approach was to buy a portable power station, plug a regular 120-volt lamp into it, and call it a day.</p><p>That would work.</p><p>But converting DC battery power to AC just so the lamp could turn it back into DC at the LED seemed unnecessarily complicated. It also meant inverter losses, additional electronics, and potentially some noise.</p><p>So the design started moving toward a DC-only system.</p><p>That led us toward a 12.8V 50Ah LiFePO₄ battery and a lamp designed around efficient DC LED lighting.</p><p>Now we weren&#x27;t just hiding a battery.</p><p>We were designing a power system.</p><h2>Then I wanted the lamp to know when we&#x27;re there</h2><p>The house already runs Home Assistant, so naturally the next question was whether the lamp could become part of it.</p><p>Turning it on and off remotely is easy.</p><p>But that isn&#x27;t especially interesting.</p><p>What if the lamp knew when someone was sitting in either chair?</p><p>That led to mmWave presence sensors.</p><p>Eventually we arrived at three sensors mounted underneath the lid of the enclosure: one aimed toward Terri&#x27;s chair, one toward mine, and one facing the room and approach area.</p><p>The sensors will be individually adjustable using 3D-printed mounts.</p><p>Their wiring will combine into a tidy harness in the lid, run through a protected service loop near the hinge, and connect to the electronics chassis through a single keyed quick-disconnect.</p><p>At this point, the lamp had become aware of the room.</p><h2>Then the box became the wrong thing to design first</h2><p>Initially, I spent quite a bit of time thinking about the enclosure.</p><p>Wood. Ventilation. Rear panels. Battery access. Where the ports should go.</p><p>Then we realized something.</p><p><strong>The box shouldn&#x27;t be the product.</strong></p><p>The electronics should.</p><p>If we could build the battery management, sensors, controller, connections, wiring, and other electronics onto a removable chassis, the whole assembly could potentially be dropped into different pieces of furniture or different enclosures.</p><p>That changed the project.</p><p>The current focus is a removable electronics tray/chassis. The battery itself remains independently removable. The rear connection and ventilation panel is modular as well.</p><p>The enclosure becomes furniture.</p><p>The chassis becomes the system.</p><p>That&#x27;s a much better design.</p><h2>Knowing what the battery is doing</h2><p>Once you&#x27;re depending on a battery to power something every day, knowing the state of the battery becomes useful.</p><p>So battery monitoring entered the design.</p><p>The current plan includes a Victron SmartShunt so Home Assistant can eventually know how much energy remains rather than relying on a crude voltage estimate.</p><p>That opens up some interesting possibilities.</p><p>The system could warn me when it needs charging. Home Assistant could make smarter decisions about how the lamp operates as the battery gets low. We can collect actual runtime data instead of estimating it.</p><p>Charging is currently planned around a 14.6V, 5A charger. That&#x27;s deliberately not an ultra-fast charging approach. The battery can be removed and charged overnight when necessary.</p><p>Simple is good.</p><p>At least occasionally.</p><h2>The interesting part isn&#x27;t really the lamp anymore</h2><p>The lamp still matters. That&#x27;s the reason this project exists.</p><p>But somewhere along the way, the more interesting question became:</p><p><strong>Can we design a self-contained smart-power and presence platform that could be installed in almost any suitable piece of furniture?</strong></p><p>That&#x27;s different.</p><p>A future version might power a lamp somewhere else. It might monitor occupancy around a chair or table. It might provide USB-C power. It might integrate another low-voltage device we haven&#x27;t thought of yet.</p><p>If the chassis is designed correctly, we don&#x27;t have to redesign the electronics every time.</p><p>We design the platform once and change the enclosure around it.</p><h2>Where it stands</h2><p>We&#x27;re still designing.</p><p>The current priority is the component tray rather than the furniture surrounding it. I want the electronics layout, serviceability, wiring, heat management, connectors, and mounting system right before worrying too much about making a beautiful wooden box.</p><p>There are still engineering decisions to make.</p><p>That&#x27;s part of the fun.</p><p>And it illustrates something I&#x27;ve noticed repeatedly while working with AI.</p><p>I can begin with a very ordinary problem:</p><p><strong>I want a lamp here, but there&#x27;s no outlet.</strong></p><p>Then I can work through the problem conversationally, challenge assumptions, visualize alternatives, discard ideas, add constraints, and keep refining the design.</p><p>The AI doesn&#x27;t have to know where we&#x27;re going at the beginning.</p><p>Neither do I.</p><p>We just keep pulling the thread.</p><p>A lamp becomes a battery project.</p><p>The battery project becomes a smart-home project.</p><p>The smart-home project becomes an electronics platform.</p><p>And somewhere along the way, the project itself becomes an example of a much larger question I&#x27;m exploring:</p><p><strong>What happens when human curiosity, experience, creativity, and judgment are paired with increasingly capable artificial intelligence?</strong></p><p>I don&#x27;t know exactly where that thread ends.</p><p>That&#x27;s probably why I keep pulling it.</p><p><em>To be continued.</em></p><p><a class="text-link" href="#/note/modular-tray">Related field note: Making room for the next revision ↗</a></p><p><a class="text-link" href="#/note/pulling-the-thread">Follow the larger thread ↗</a></p>`},{id:'accounting',number:'003',title:'Smarter QBO bank rules',kind:'ledger',status:'Exploration',description:'Exploring more thoughtful QuickBooks bank rules and better bookkeeping workflows.',subtitle:'Looking for better ways to make the routine work.',body:`<p>Accounting is full of repeated decisions. That makes it an interesting place to explore tools that can help make workflows more consistent and easier to understand.</p><h2>Two related questions</h2><p>One area of exploration is intelligent QuickBooks bank-rule design. Another is the architecture of an independent accounting ledger.</p><p>They share a practical question: what should be automated, what should remain visible, and where should a person make the decision?</p><h2>Keeping the work public, carefully</h2><p>This page will focus on methods, design choices, and lessons that can be shared without exposing professional or client-sensitive information. Any future examples will need to be suitable for public use.</p><h2>A starting point</h2><p>This is a project outline. Specific implementations, findings, and comparisons will be added as the work is documented.</p>`}];
projects.push({id:'independent-ledger',number:'004',title:'An independent accounting ledger',kind:'ledger',status:'Concept',description:'Exploring what a modern ledger could look like, with more control and portability.',subtitle:'A question about the foundations of accounting software.',body:`<p>An independent ledger is an architecture I’m exploring: a way to think through the accounting records themselves, and how the surrounding tools should work with them.</p><h2>Questions to work through</h2><p>What should the ledger own? How should records move between systems? Where can AI help, and where must the accounting remain explicit and verifiable?</p><h2>Where it stands</h2><p>This is a concept in development. This journal will document the design choices, experiments, and lessons as the work progresses. Any examples will need to be suitable for public use, without professional or client-sensitive information.</p>`});
const notes=[{id:'enhance-alter',number:'01',title:'When “Enhance” Becomes “Alter”',category:'AI / Fidelity',description:'What restoring an old family photograph taught me about working with AI.',subtitle:'Sometimes fidelity matters more than improvement.',body:`<p>I asked ChatGPT to restore an old, faded photograph of my parents and make a black-and-white version.</p><div class="family-comparison"><figure><a href="parents-original.jpeg" target="_blank" rel="noopener"><img src="parents-original.jpeg" alt="The faded black-and-white photograph of my parents sitting together outdoors." loading="lazy"></a><figcaption>Original photograph</figcaption></figure><figure><a href="parents-altered.png" target="_blank" rel="noopener"><img src="parents-altered.png" alt="The AI-restored version with the unintended change to my mother’s gaze." loading="lazy"></a><figcaption>Unintended gaze change</figcaption></figure><figure><a href="parents-restored.jpeg" target="_blank" rel="noopener"><img src="parents-restored.jpeg" alt="The corrected restored black-and-white version of the same family photograph." loading="lazy"></a><figcaption>Corrected restoration</figcaption></figure></div><p class="comparison-context">Original → unintended gaze change → corrected restoration, shown as supplied. The photographs have different framing; open any image to inspect it at full size.</p><p>The photograph looked improved. But something else had changed: my mother’s eyes now appeared to be looking directly at the camera. That was not where she was looking in the original.</p><h2>A better image—or a different one?</h2><p>Restoring the photograph was the task. Changing the subject was not. The altered gaze was a small visual difference with a much larger consequence: it changed what the photograph recorded.</p><h2>Putting control back into the process</h2><p>I asked ChatGPT to reverse the change and identify and reverse any other unintended alterations to the subjects. We then established a rule that changes of this kind should require permission.</p><h2>The lesson I’m keeping</h2><p>When I ask for an enhancement, I need to be clear about what must remain faithful to the source. “Improve this” can leave too much room for interpretation.</p><blockquote>Sometimes what I want most is not improvement, but fidelity.</blockquote>`},{id:'downton',number:'02',title:'The clue was in the subtitles',category:'AI / Experiment',description:'Identifying out-of-order Downton Abbey episodes took a more reliable turn.',subtitle:'A useful reminder to try a different kind of evidence.',body:`<p>I was trying to identify incorrectly ordered Blu-ray rips of Downton Abbey. The experiment began with screenshots: could AI recognize which episode I was looking at?</p><h2>A different source of evidence</h2><p>The more reliable approach turned out to be extracting and reading subtitles from the already-ripped video files. Dialogue provided a better route to identification than the screenshots.</p><h2>What changed</h2><p>The task stayed the same. The evidence changed. Instead of asking the model to identify an episode from an image, we gave it text from the episode itself.</p><h2>A lesson beyond this experiment</h2><p>When an AI-assisted approach is uncertain, it can be useful to rethink the input before refining the prompt again. Sometimes another representation of the same material makes the problem much easier to work through.</p><p>This note describes the method; it does not reproduce episode footage or subtitle transcripts.</p>`}];
notes.push({id:'modular-tray',number:'03',title:'Making room for the next revision',category:'Design / In progress',description:'Exploring a removable electronics tray for the smart lamp.',subtitle:'A working design question from the smart lamp project.',body:`<p>The smart lamp project includes an idea for a removable electronics chassis or tray. Rather than treating the enclosure as a final step, it becomes part of the design process.</p><h2>A design still taking shape</h2><p>The project explores ESP hardware, presence sensing, battery monitoring, and possible 3D-printed parts. A removable tray raises useful questions about how these pieces fit together and how the design can accommodate the next revision.</p><p>This is a starting note for documenting the mechanical and electrical decisions as they develop.</p><p><a class="text-link" href="#/project/smart-lamp">Read the lamp project story ↗</a></p>`});
notes.unshift({id:'pulling-the-thread',number:'04',title:'Pulling the Thread',category:'Curiosity / Connections',description:'Practical projects, larger questions, and the connections between them.',subtitle:'Most things here begin with a question.',body:`<p>I tend to encounter something interesting, ask a question, and start pulling on it. One question produces another. Sometimes the thread leads to an accounting system. Sometimes it leads to an electronics project. Sometimes it leads to AI. And sometimes it leads to much larger questions about meaning, faith, creativity, love, beauty, or God.</p><p>The destination isn’t predetermined. That’s the point.</p><h2>Threads in the same life</h2><p>One thread is about what we can do: artificial intelligence, technology, accounting systems, building things, solving problems, experimenting, and learning.</p><p>The other is about what all of that makes me think about: creativity, intuition, relationships, meaning, beauty, faith, God, and what it means to be human.</p><p>I love working with AI and am fascinated by what human beings can accomplish in partnership with it. Exploring artificial intelligence has simply made me more interested in the boundary between intelligence and the rest of human experience.</p><h2>Field notes for a life story</h2><p>I’m working on a biography/life-story project. I don’t want this website itself to become my biography. Instead, I like thinking of it as field notes for the biography.</p><p>Projects document what I was doing. Notebook entries document what I was thinking. Pulling the Thread helps preserve how one question, interest, project, memory, or experience connected to another.</p><p>Years from now, those threads may help explain not merely what happened in my life, but how I got from one place to another.</p><h2>A lamp is one place to start</h2><p><a class="text-link" href="#/project/smart-lamp">A lamp became a battery-powered furniture platform ↗</a></p><p>An ordinary problem led through power systems, presence sensing, and modular electronics—and into a larger question about what happens when human curiosity, experience, creativity, and judgment are paired with AI.</p><p>These are my field notes from following both.</p>`});
notes.unshift({id:'intelligence-and-experience',number:'05',title:'What Intelligence Can’t Bring You',category:'Reflection',description:'What working with AI makes me think about faith, love, beauty, and human experience.',subtitle:'A working thought about intelligence and human experience.',body:`<p>The more I work with artificial intelligence, the more impressed I become with what intelligence can do.</p><p>And strangely, the more interested I become in what it can&#x27;t.</p><p>AI can help me design something, analyze a problem, explain an idea, write software, organize information, and sometimes see possibilities I hadn&#x27;t considered.</p><p>But intelligence isn&#x27;t the whole of human experience.</p><p>AI can discuss faith. It doesn&#x27;t have faith.</p><p>It can analyze grief. It doesn&#x27;t grieve.</p><p>It can write about love. It doesn&#x27;t love.</p><p>It can recognize patterns we call beautiful. Whether it experiences beauty is another question entirely.</p><p>It can reason about God. That isn&#x27;t the same thing as encountering God.</p><p>I don&#x27;t see any of that as an argument against artificial intelligence.</p><p>I&#x27;m fascinated by AI. I love exploring what I can accomplish with it.</p><p>But perhaps one unexpected benefit of spending so much time exploring artificial intelligence is that it makes the boundaries of intelligence itself more interesting.</p><p>What is creativity?</p><p>Where does intuition come from?</p><p>Why does beauty matter to us?</p><p>What makes a relationship meaningful?</p><p>Where do conscience and purpose come from?</p><p>What does faith give us that knowledge cannot?</p><p>And what happens when intelligence—something human beings have traditionally considered one of our defining characteristics—is no longer exclusively ours?</p><p>I don&#x27;t have tidy answers to those questions.</p><p>That&#x27;s why they&#x27;re worth writing about.</p><p>It&#x27;s another thread.</p><p>And I intend to pull it.</p><p><a class="text-link" href="#/note/pulling-the-thread">How these threads connect ↗</a></p><p><a class="text-link" href="#/project/smart-lamp">The lamp project that prompted a larger question ↗</a></p>`});
notes.unshift({"id": "build-a-bridge", "number": "06", "title": "More AI. More Judgment. More Discipline.", "category": "AI / People / Work", "description": "AI creates capacity. How do we help the people doing the work grow into what comes next?", "subtitle": "Don’t just automate the work. Build a bridge for the people whose work is being automated.", "body": "<figure class=\"lamp-concept\"><a href=\"bridge-for-the-people.png\" target=\"_blank\" rel=\"noopener\"><img src=\"bridge-for-the-people.png\" alt=\"Two people cross a wooden bridge from stacks of paperwork toward a group in conversation, connected by a rust-colored thread.\"></a><figcaption>AI-generated illustration of building a bridge from routine work toward human judgment and connection.</figcaption></figure><p>I’ve been thinking about something that feels a little backwards.</p><p>We usually talk about AI in terms of efficiency.</p><p>How much work can it save?</p><p>How many tasks can it automate?</p><p>How much faster can we get things done?</p><p>Those are fair questions, and in a lot of cases the answers are impressive.</p><p>But I’m starting to think they may not be the most important questions.</p><p>AI is making it possible to do things that would have been impractical not very long ago. We can analyze more information, draft more communication, build more systems, ask more questions, follow more threads, and generally do more with less effort.</p><p>That sounds great.</p><p>And it is great.</p><p>But there’s a catch.</p><p>I’m still human.</p><p>My time is limited. My attention is limited. My energy is limited. My judgment is limited.</p><p>Even when AI is doing a lot of the work, I’m still in the loop somewhere. I have to decide what matters. I have to review things. I have to choose what to pursue and what to leave alone.</p><p>So one thing I’m learning is restraint.</p><p>Just because something can be done doesn’t mean it deserves to be done.</p><p>The output may be cheap.</p><p>My attention isn’t.</p><p>I think there’s a work version of this too.</p><p>We’re already seeing that AI can help us do accounting work more efficiently. It can help with routine analysis, drafting, reviewing, identifying anomalies, and all sorts of things that used to take a lot more time.</p><p>That creates capacity.</p><p>But what I’m starting to notice is that the extra capacity doesn’t necessarily just disappear into lower labor cost.</p><p>Sometimes it creates the opportunity to provide more value.</p><p>If we can spend less time producing the basic work, maybe we can spend more time understanding it.</p><p>Maybe we can communicate with clients more proactively.</p><p>Maybe we can spot problems earlier.</p><p>Maybe we can explain what the numbers mean instead of simply handing them over.</p><p>Maybe we can help clients make better decisions.</p><p>And the interesting thing is that the more valuable that work becomes, the more human judgment it seems to require.</p><p>AI can surface an issue.</p><p>A person still has to decide whether it matters.</p><p>AI can draft an explanation.</p><p>A person still has to decide whether it’s right.</p><p>AI can suggest possible actions.</p><p>A person still has to decide what should actually happen.</p><p>So I’m not sure the future is as simple as “AI means fewer people.”</p><p>It may mean less human effort spent on certain kinds of work.</p><p>But it may also mean more human effort spent on judgment, communication, relationships, and decision-making.</p><p>That creates another question.</p><p>What happens to the people already doing the work?</p><p>This may be the part I’m most interested in.</p><p>A lot of good people have built careers around being really good at execution. They know how to follow a process. They know how to get the work done accurately. They know the clients. They know the weird exceptions. They know where the bodies are buried, so to speak.</p><p>That knowledge matters.</p><p>But the nature of the job may be changing around them.</p><p>If AI handles more of the repetitive production work, then the people doing that work may need to move toward understanding, interpretation, communication, and ownership.</p><p>That’s a big jump.</p><p>And I don’t think it happens automatically.</p><p>You can’t just hand someone an AI tool and say, “Okay, now use better judgment.”</p><p>You have to help them develop it.</p><p>That probably means explaining more of the “why,” not just the “how.”</p><p>It means exposing people to decisions they may not have seen before.</p><p>It means letting them participate in client conversations.</p><p>It means reviewing exceptions together and talking through the reasoning.</p><p>It means giving people room to make decisions while someone more experienced is still close enough to help.</p><p>And it probably means changing what we reward.</p><p>If we continue rewarding people mainly for how many tasks they complete and how quickly they complete them, then we’re training them to optimize for the exact kind of work AI is getting better at.</p><p>That doesn’t seem like a great long-term plan.</p><p>I keep coming back to this idea:</p><p>Don’t just automate the work.</p><p>Build a bridge for the people whose work is being automated.</p><p>That doesn’t mean everyone will want to cross it.</p><p>Some people genuinely prefer structured, repeatable work. That’s okay. But if that work is changing, I think we owe people some honesty about what’s happening and a real opportunity to grow into what comes next.</p><p>The more I think about this, the less I believe AI is mainly a technology story.</p><p>It’s a people story.</p><p>AI can make more possible.</p><p>But people still have to decide what’s worth doing.</p><p>People still have to exercise judgment.</p><p>People still have to communicate.</p><p>People still have to take responsibility.</p><p>And if AI really does raise the ceiling on what we can do, then maybe one of our biggest challenges isn’t figuring out how to use less human talent.</p><p>Maybe it’s figuring out how to help our people become more valuable.</p>"});
